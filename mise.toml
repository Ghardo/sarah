[tools]
go = "1.27"
node = "24"
pnpm = "10"

[env]
GOCACHE = "{{config_root}}/.cache"

[tasks.builder]
description = "Create the builder image for the Pi 4 (arm64)"
run = "podman build -t sarah-builder ."

[tasks.ui]
description = "Build the web UI (goes to src/ui/dist and is embedded into the binary)"
dir = "{{config_root}}/web"
run = ["pnpm install --frozen-lockfile", "pnpm build"]

[tasks.build]
description = "Build the web UI and the binary for the Pi 4 (sarah-pi4)"
depends = ["ui"]
run = "podman run --rm -v ./:/app:Z sarah-builder sh ./build-pi.sh"
